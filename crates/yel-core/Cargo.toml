[package]
name = "yel-core"
version.workspace = true
edition = "2024"
description = "Yel compiler core"
license.workspace = true

[dependencies]
# Parsing
pest.workspace = true
pest_derive.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true
rustc-hash.workspace = true
anyhow.workspace = true

# Code generation
quote.workspace = true
proc-macro2.workspace = true
syn.workspace = true
prettyplease.workspace = true
wasm-encoder.workspace = true
wasmprinter.workspace = true
wit-parser.workspace = true
wit-component.workspace = true
wasm-metadata.workspace = true
wit-encoder.workspace = true
semver.workspace = true

# Utilities
indexmap.workspace = true
parking_lot.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true

[build-dependencies]
serde_json.workspace = true

# Determinism guard: forbid std HashMap/HashSet (random-seeded iteration order
# leaks into emitted output). See root clippy.toml and docs/TECH_DEBT.md §7.
# Crate-scoped (not [workspace.lints]) to match the existing per-crate style.
[lints.clippy]
disallowed_types = "deny"
