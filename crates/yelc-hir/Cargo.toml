[package]
name = "yelc-hir"
version.workspace = true
edition = "2024"
description = "Yel HIR: one IR, built in stage 3 and checked in stage 4"
license.workspace = true

[dependencies]
rustc-hash.workspace = true
yelc-base.workspace = true
yelc-sema.workspace = true
yelc-syntax.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
# Differential harness only (tests/frozen_parity.rs): the frozen front-end is
# the oracle for the definition table and the diagnostic set. Nothing in the
# library links it, and it goes away with the frozen tree at cutover phase 4 —
# the same pattern as yelc-syntax/tests/parity.rs and
# yelc-sema/tests/single_namespace.rs (anti-spec A4).
yel-core.workspace = true

# Determinism guard — see plans/rewrite/anti-spec.md A6.
[lints.clippy]
disallowed_types = "deny"
