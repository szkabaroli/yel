[package]
name = "yel-host"
version.workspace = true
edition = "2021"
description = "Host runtime for testing Yel components"
license.workspace = true

[[bin]]
name = "yel-host"
path = "src/main.rs"

[dependencies]
wasmtime.workspace = true
wasmtime-wasi.workspace = true
anyhow.workspace = true
clap.workspace = true
wasmparser.workspace = true
ratatui = "0.29"
crossterm = "0.28"
tracing = "0.1"
tracing-subscriber = "0.3"
tui-logger = { version = "0.14", features = ["tracing-support"] }

# Dev host, not part of the compiler's emitted output — exempt from the
# determinism-guard in root clippy.toml so its std HashMap uses aren't flagged.
[lints.clippy]
disallowed_types = "allow"
