[workspace]
members = [
  "crates/yelc",
  "crates/yel-core",
  # --- rewrite tree (see plans/rewrite/README.md) ---
  "crates/yelc-base",
  "crates/yelc-syntax",
  "crates/yelc-driver",
  "crates/yelc-sema",
  "crates/yel-host",
  "crates/yel-lsp",
  "crates/yel-smith",
  "crates/yel-wasm-codegen",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
# Internal crates
yel-core = { path = "crates/yel-core" }
yel-wasm-codegen = { path = "crates/yel-wasm-codegen" }
# Rewrite tree
yelc-base = { path = "crates/yelc-base" }
yelc-syntax = { path = "crates/yelc-syntax" }
yelc-driver = { path = "crates/yelc-driver" }
yelc-sema = { path = "crates/yelc-sema" }

# CLI & Error handling
anyhow = "1"
thiserror = "1.0"
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Binary codec for package artifacts. postcard, not bincode: postcard's wire
# format is a separately published, versioned specification frozen for all of
# 1.x, so an artifact is invalidated only when *our* schema moves — which is
# exactly what the artifact stamp's `format` field is for. bincode is
# unmaintained (RUSTSEC-2025-0141). See plans/modules.md §6.6.
postcard = { version = "1.1", default-features = false, features = ["use-std"] }

# Parsing
pest = "2.7"
pest_derive = "2.7"

# Code generation (Rust)
quote = "1.0"
proc-macro2 = "1.0"
syn = "2.0"
prettyplease = "0.2"

# WebAssembly
wasm-encoder = "0.248"
wasmparser = "0.248"
wasmprinter = "0.248"
wit-parser = "0.248"
wit-component = { version = "0.248", features = ["dummy-module"] }
wasm-metadata = "0.248"
wit-encoder = { version = "0.248", features = ["from-parser"] }
wit-bindgen = "0.51"
wasmtime = { version = "=44.0.0", features = ["component-model", "wave"] }
wasmtime-wasi = "=44.0.0"

# Utilities
semver = "1.0"
indexmap = "2.0"
parking_lot = "0.12"
# Fast non-cryptographic hasher for internal compiler maps (no DoS surface).
rustc-hash = "2"
# Inline-capacity vectors. Used for the symbol table's per-name symbol list,
# which holds exactly one entry for every name that is not an overload set.
smallvec = "1"

# Fuzzing
arbitrary = { version = "1.3", features = ["derive"] }
libfuzzer-sys = "0.4"

# Testing
pretty_assertions = "1.4"
insta = "1"

# Build info (default-features = false to avoid git2/libgit2 for WASM compat)
shadow-rs = { version = "0.37", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
